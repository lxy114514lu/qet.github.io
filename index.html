<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鲁轩毓 · 个人简历</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-light: #818CF8;
            --primary-dark: #3730A3;
            --secondary: #06B6D4;
            --secondary-light: #22D3EE;
            --accent: #F59E0B;
            --bg: #F5F7FA;
            --surface: #FFFFFF;
            --surface-hover: #F8FAFC;
            --text: #1E293B;
            --text-secondary: #64748B;
            --text-muted: #94A3B8;
            --border: #E2E8F0;
            --border-light: #F1F5F9;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.12);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-xl: 28px;
            --nav-height: 64px;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            --transition: 200ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 350ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg: #0F172A;
            --surface: #1E293B;
            --surface-hover: #273449;
            --text: #F1F5F9;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            --border: #334155;
            --border-light: #1E293B;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.25);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.35);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.45);
            --primary: #818CF8;
            --primary-light: #A5B4FC;
            --primary-dark: #6366F1;
            --secondary: #22D3EE;
            --secondary-light: #67E8F9;
            --accent: #FBBF24;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: calc(var(--nav-height) + 20px);
            font-size: 16px;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            transition: background var(--transition), color var(--transition);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ========== 导航栏 ========== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            height: var(--nav-height);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            transition: background var(--transition), border-color var(--transition), box-shadow var(--transition);
        }
        [data-theme="dark"] .navbar {
            background: rgba(30, 41, 59, 0.85);
        }
        .navbar.scrolled {
            box-shadow: var(--shadow-md);
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.12rem;
            letter-spacing: -0.02em;
            color: var(--text);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .navbar-brand .brand-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: inline-block;
            flex-shrink: 0;
        }

        .navbar-links {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: nowrap;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .navbar-links::-webkit-scrollbar {
            display: none;
        }

        .navbar-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.84rem;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 20px;
            transition: all var(--transition);
            white-space: nowrap;
            flex-shrink: 0;
        }
        .navbar-links a:hover,
        .navbar-links a:focus-visible {
            color: var(--primary);
            background: var(--border-light);
        }
        .navbar-links a.active {
            background: var(--primary);
            color: #fff;
        }

        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition);
            font-size: 1rem;
            flex-shrink: 0;
            position: relative;
        }
        .icon-btn:hover {
            background: var(--surface-hover);
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }
        .icon-btn:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        /* ========== Hero 区（左右布局） ========== */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: calc(var(--nav-height) + 40px) 24px 40px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(165deg, var(--surface) 0%, var(--bg) 60%, var(--surface) 100%);
            isolation: isolate;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: -20%;
            right: -10%;
            width: 50%;
            height: 60%;
            background: radial-gradient(ellipse at center, rgba(79, 70, 229, 0.06) 0%, transparent 70%);
            pointer-events: none;
            border-radius: 50%;
            z-index: -1;
        }
        .hero::after {
            content: '';
            position: absolute;
            bottom: -20%;
            left: -10%;
            width: 50%;
            height: 60%;
            background: radial-gradient(ellipse at center, rgba(6, 182, 212, 0.05) 0%, transparent 70%);
            pointer-events: none;
            border-radius: 50%;
            z-index: -1;
        }
        .hero-grid-bg {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(var(--border) 1px, transparent 1px);
            background-size: 32px 32px;
            opacity: 0.2;
            z-index: -2;
            pointer-events: none;
        }

        .hero-content {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 48px;
            align-items: center;
            max-width: 1100px;
            width: 100%;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.6s ease-out both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-left {
            text-align: left;
        }
        .hero-left .hero-name {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.1;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--text) 0%, var(--primary) 60%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero-left .hero-title {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 20px;
            letter-spacing: 0.02em;
        }
        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-top: 12px;
        }

        .hero-right {
            text-align: left;
        }
        .hero-description {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: 20px;
            opacity: 0.9;
            max-width: 100%;
        }
        .hero-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 0;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.76rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            transition: all var(--transition);
            user-select: none;
            box-shadow: var(--shadow-sm);
        }
        .badge:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }
        .badge .badge-icon {
            font-size: 0.9rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            border-radius: 25px;
            font-size: 0.88rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all var(--transition);
            letter-spacing: 0.01em;
            white-space: nowrap;
            font-family: inherit;
        }
        .btn:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            box-shadow: 0 4px 16px rgba(79, 70, 229, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(79, 70, 229, 0.4);
        }
        .btn-secondary {
            background: var(--surface);
            color: var(--text);
            border: 1.5px solid var(--border);
        }
        .btn-secondary:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        /* ========== 通用区块 ========== */
        .section {
            padding: 80px 24px;
            max-width: 1100px;
            margin: 0 auto;
        }
        .section-header {
            text-align: center;
            margin-bottom: 48px;
        }
        .section-header h2 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }
        .section-header .section-subtitle {
            color: var(--text-secondary);
            font-size: 0.92rem;
        }
        .section-header .section-accent {
            width: 48px;
            height: 4px;
            border-radius: 2px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            margin: 12px auto 0;
        }

        /* ========== 亮点成果 ========== */
        .highlights-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }
        .highlight-card {
            background: var(--surface);
            border-radius: var(--radius-md);
            padding: 28px 22px;
            text-align: center;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            transition: all var(--transition);
            animation: fadeInUp 0.5s ease-out both;
            position: relative;
            overflow: hidden;
        }
        .highlight-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            opacity: 0;
            transition: opacity var(--transition);
        }
        .highlight-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary-light);
        }
        .highlight-card:hover::before {
            opacity: 1;
        }
        .highlight-number {
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }
        .highlight-label {
            font-size: 0.88rem;
            color: var(--text-secondary);
            margin-top: 6px;
            font-weight: 500;
        }
        .highlight-desc {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 8px;
            line-height: 1.5;
        }

        /* ========== Tabs 通用 ========== */
        .tabs-container {
            background: var(--surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            transition: background var(--transition), border-color var(--transition);
        }
        .tabs-nav {
            display: flex;
            gap: 0;
            border-bottom: 2px solid var(--border);
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            background: var(--surface);
            padding: 0 8px;
            flex-shrink: 0;
        }
        .tabs-nav::-webkit-scrollbar {
            display: none;
        }
        .tab-btn {
            padding: 14px 20px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            background: none;
            color: var(--text-secondary);
            transition: all var(--transition);
            white-space: nowrap;
            flex-shrink: 0;
            position: relative;
            font-family: inherit;
            letter-spacing: 0.01em;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }
        .tab-btn:hover {
            color: var(--primary);
            background: var(--surface-hover);
        }
        .tab-btn:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: -2px;
        }
        .tab-btn[aria-selected="true"] {
            color: var(--primary);
            border-bottom-color: var(--primary);
            font-weight: 700;
        }
        .tab-panel {
            padding: 24px 20px;
            display: none;
            animation: fadeIn 0.25s ease-out both;
        }
        .tab-panel[aria-hidden="false"] {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========== 时间线 ========== */
        .timeline {
            position: relative;
            padding-left: 28px;
        }
        .timeline::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 4px;
            bottom: 4px;
            width: 2px;
            background: var(--border);
            border-radius: 1px;
        }
        .timeline-item {
            position: relative;
            padding-bottom: 28px;
            padding-left: 12px;
        }
        .timeline-item:last-child {
            padding-bottom: 0;
        }
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -24px;
            top: 7px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary);
            border: 3px solid var(--surface);
            box-shadow: 0 0 0 2px var(--primary-light);
            z-index: 1;
        }
        .timeline-item .timeline-date {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.02em;
        }
        .timeline-item .timeline-title {
            font-weight: 700;
            font-size: 1rem;
            margin-top: 2px;
        }
        .timeline-item .timeline-subtitle {
            font-size: 0.88rem;
            color: var(--text-secondary);
        }
        .timeline-item .timeline-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 6px;
            line-height: 1.7;
        }

        /* ========== 技能矩阵 ========== */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .skill-card {
            background: var(--surface);
            border-radius: var(--radius-md);
            padding: 24px 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            transition: all var(--transition);
        }
        .skill-card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--primary-light);
            transform: translateY(-2px);
        }
        .skill-card .skill-card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        .skill-card .skill-card-header .skill-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }
        .skill-card .skill-card-header h3 {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }
        .skill-item {
            margin-bottom: 12px;
        }
        .skill-item:last-child {
            margin-bottom: 0;
        }
        .skill-item .skill-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .skill-item .skill-level {
            font-size: 0.72rem;
            color: var(--text-muted);
            font-weight: 500;
        }
        .skill-bar {
            height: 6px;
            border-radius: 3px;
            background: var(--border-light);
            overflow: hidden;
            position: relative;
        }
        .skill-bar .skill-bar-fill {
            height: 100%;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            width: 0;
        }
        .skill-bar .skill-bar-fill.animated {
            width: var(--fill, 0%);
        }
        .skill-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        .skill-tag {
            padding: 4px 12px;
            border-radius: 14px;
            font-size: 0.74rem;
            font-weight: 500;
            background: var(--border-light);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            transition: all var(--transition);
        }
        .skill-tag:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--surface-hover);
        }

        /* ========== 证书卡片 ========== */
        .cert-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
        }
        .cert-card {
            background: var(--surface);
            border-radius: var(--radius-md);
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
        }
        .cert-card::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, transparent 50%, rgba(79, 70, 229, 0.05) 100%);
            border-radius: 0 0 0 100%;
            pointer-events: none;
        }
        .cert-card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--primary-light);
            transform: translateY(-2px);
        }
        .cert-card .cert-org {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 6px;
        }
        .cert-card .cert-name {
            font-size: 0.95rem;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 6px;
        }
        .cert-card .cert-meta {
            font-size: 0.78rem;
            color: var(--text-muted);
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .cert-card .cert-meta span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .cert-card .cert-desc {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border-light);
            line-height: 1.6;
        }

        /* ========== 页脚 ========== */
        .footer {
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 32px 24px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .footer a {
            color: var(--primary);
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }

        /* ========== 返回顶部 ========== */
        .back-to-top {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: var(--shadow-md);
            opacity: 0;
            pointer-events: none;
            transform: translateY(16px);
            transition: all var(--transition);
            z-index: 900;
        }
        .back-to-top.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }
        .back-to-top:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
        }
        .back-to-top:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        /* ========== 复制提示 ========== */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(16px);
            background: var(--text);
            color: var(--bg);
            padding: 10px 20px;
            border-radius: 25px;

            function el(tag, attrs = {}, ...children) {
                const node = document.createElement(tag);
                for (const [key, value] of Object.entries(attrs)) {
                    if (key === 'class') node.className = value;
                    else if (key === 'html') node.innerHTML = value;
                    else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
                    else if (key === 'style' && typeof value === 'object') Object.assign(node.style, value);
                    else node.setAttribute(key, value);
                }
                for (const child of children) {
                    if (child == null || child === false) continue;
                    if (typeof child === 'string') node.appendChild(document.createTextNode(child));
                    else if (child instanceof Node) node.appendChild(child);
                    else if (Array.isArray(child)) child.forEach(c => node.appendChild(c));
                }
                return node;

                document.querySelectorAll('.navbar-links a').forEach(link => {
                    link.classList.toggle('active', link.getAttribute('href') === '#' + currentId);

                        entries.forEach(entry => {
                            if (entry.isIntersecting) {
                                const bar = entry.target;
                                const fill = bar.getAttribute('data-fill') || '0%';
                                bar.style.setProperty('--fill', fill);
                                bar.classList.add('animated');
                                observer.unobserve(bar);
                            }
                        });
                    }, { threshold: 0.3 });
                    bars.forEach(bar => observer.observe(bar));
                } else {
                    bars.forEach(bar => {
                        bar.style.setProperty('--fill', bar.getAttribute('data-fill') || '0%');
                        bar.classList.add('animated');
                    });

            }

            function renderSkills() {
                const skillGroups = Object.values(resume.skills);
                const cards = skillGroups.map((group, gi) => {
                    const itemsHtml = group.items.map(item => {
                        const tags = (item.tags || []).map(t =>
                            el('span', { class: 'skill-tag' }, t)
                        );
                        return el('div', { class: 'skill-item' },
                            el('div', { class: 'skill-label' },
                                el('span', {}, item.name),
                                el('span', { class: 'skill-level' }, item.level + '%')
                            ),
                            el('div', { class: 'skill-bar' },
                                el('div', {
                                    class: 'skill-bar-fill',
                                    'data-fill': item.level + '%',
                                    'role': 'progressbar',
                                    'aria-valuenow': item.level,
                                    'aria-valuemin': '0',
                                    'aria-valuemax': '100',
                                    'aria-label': item.name + ' 熟练度'
                                })
                            ),
                            tags.length ? el('div', { class: 'skill-tags' }, tags) : null
                        );
                    });
                    return el('div', { class: 'skill-card', style: { animationDelay: (gi * 100) + 'ms' } },
                        el('div', { class: 'skill-card-header' },
                            el('div', { class: 'skill-icon', 'aria-hidden': 'true' }, group.icon),
                            el('h3', {}, group.title)
                        ),
                        itemsHtml
                    );
                });
                return el('section', { class: 'section', id: 'skills', 'aria-label': '技能矩阵' },
                    el('div', { class: 'section-header' },
                        el('h2', {}, '🛠️ 技能矩阵'),
                        el('p', { class: 'section-subtitle' }, '语言 · AI · 云平台 · 开发实践'),
                        el('div', { class: 'section-accent' })
                    ),
                    el('div', { class: 'skills-grid' }, cards)
                );
            }

            function renderExperienceTabs() {
                const tabsData = [
                    { id: 'work', label: '💼 工作/实习', items: resume.experience.work.items,
                        placeholder: resume.experience.work.placeholder },
                    { id: 'campus', label: '🏫 校园经历', items: resume.experience.campus.items,
                        placeholder: resume.experience.campus.placeholder },
                    { id: 'project', label: '🚀 项目与实践', items: resume.experience.project.items,
                        placeholder: resume.experience.project.placeholder },
                ];

                const tabsNav = el('div', { class: 'tabs-nav', role: 'tablist', 'aria-label': '经历分类' });
                const panels = [];

                tabsData.forEach((tab, index) => {
                    const btnId = 'exp-tab-' + tab.id;
                    const panelId = 'exp-panel-' + tab.id;
                    const btn = el('button', {
                        class: 'tab-btn',
                        role: 'tab',
                        id: btnId,
                        'aria-selected': index === 0 ? 'true' : 'false',
                        'aria-controls': panelId,
                        tabindex: index === 0 ? '0' : '-1',
                        onclick: () => switchTab(tabsNav, panels, index)
                    }, tab.label);
                    btn.addEventListener('keydown', (e) => handleTabKeydown(e, tabsNav, panels, index));
                    tabsNav.appendChild(btn);

                    let panelContent;
                    if (tab.items && tab.items.length > 0) {
                        panelContent = el('div', { class: 'timeline' },
                            tab.items.map(item =>
                                el('div', { class: 'timeline-item' },
                                    el('div', { class: 'timeline-date' }, item.period),
                                    el('div', { class: 'timeline-title' }, item.title),
                                    item.subtitle ? el('div', { class: 'timeline-subtitle' }, item
                                        .subtitle) : null,
                                    item.description ? el('div', { class: 'timeline-desc' }, item
                                        .description) : null
                                )
                            )
                        );
                    } else {
                        panelContent = el('div', { class: 'placeholder-box' },
                            el('div', { class: 'placeholder-icon', 'aria-hidden': 'true' }, '📝'),
                            el('p', {}, tab.placeholder || '暂无内容')
                        );
                    }

                    const panel = el('div', {
                        class: 'tab-panel',
                        role: 'tabpanel',
                        id: panelId,
                        'aria-labelledby': btnId,
                        'aria-hidden': index === 0 ? 'false' : 'true',
                        tabindex: '0'
                    }, panelContent);
                    panels.push(panel);
                });

                const container = el('div', { class: 'tabs-container' }, tabsNav, ...panels);
                return container;
            }

            function renderEducationAndCerts() {
                const educationSection = el('div', { style: { marginBottom: '48px' } },
                    el('div', { class: 'section-header', style: { marginBottom: '24px' } },
                        el('h3', { style: { fontSize: '1.4rem', fontWeight: '700' } }, '🎓 教育背景'),
                        el('div', { class: 'section-accent' })
                    ),
                    el('div', { class: 'timeline' },
                        el('div', { class: 'timeline-item' },
                            el('div', { class: 'timeline-date' }, resume.education.period),
                            el('div', { class: 'timeline-title' }, resume.education.school + ' · ' + resume
                                .education.major),
                            el('div', { class: 'timeline-desc' }, resume.education.detail)
                        )
                    )
                );

                const certTabsData = Object.values(resume.certificates);
                const certNav = el('div', { class: 'tabs-nav', role: 'tablist', 'aria-label': '证书分类' });
                const certPanels = [];

                certTabsData.forEach((tab, index) => {
                    const btnId = 'cert-tab-' + index;
                    const panelId = 'cert-panel-' + index;
                    const btn = el('button', {
                        class: 'tab-btn',
                        role: 'tab',
                        id: btnId,
                        'aria-selected': index === 0 ? 'true' : 'false',
                        'aria-controls': panelId,
                        tabindex: index === 0 ? '0' : '-1',
                        onclick: () => switchTab(certNav, certPanels, index)
                    }, tab.title);
                    btn.addEventListener('keydown', (e) => handleTabKeydown(e, certNav, certPanels, index));
                    certNav.appendChild(btn);

                    const certCards = tab.items.map(cert =>
                        el('div', { class: 'cert-card' },
                            el('div', { class: 'cert-org' }, tab.org),
                            el('div', { class: 'cert-name' }, cert.name),
                            el('div', { class: 'cert-meta' },
                                el('span', {}, '📅 ' + cert.meta)
                            ),
                            cert.desc ? el('div', { class: 'cert-desc' }, cert.desc) : null
                        )
                    );
                    const summaryPara = tab.summary ? el('p', {
                        style: 'font-size:0.82rem;color:var(--text-secondary);margin-bottom:16px;padding:0 4px;line-height:1.6;' },
                        '💡 ' + tab.summary
                    ) : null;
                    const panel = el('div', {
                        class: 'tab-panel',
                        role: 'tabpanel',
                        id: panelId,
                        'aria-labelledby': btnId,
                        'aria-hidden': index === 0 ? 'false' : 'true',
                        tabindex: '0'
                    }, summaryPara, el('div', { class: 'cert-grid' }, certCards));
                    certPanels.push(panel);
                });

                const certContainer = el('div', { class: 'tabs-container' }, certNav, ...certPanels);

                const certSection = el('div', {},
                    el('div', { class: 'section-header', style: { marginBottom: '24px' } },
                        el('h3', { style: { fontSize: '1.4rem', fontWeight: '700' } }, '🏆 认证证书（能力证明）'),
                        el('p', { style: 'font-size:0.9rem;color:var(--text-muted);margin-top:4px;' }, '认证是学习过程的记录，实践能力请见“项目与实践”'),
                        el('div', { class: 'section-accent' })
                    ),
                    certContainer
                );

                return el('section', { class: 'section', id: 'education', 'aria-label': '教育与证书' },
                    educationSection,
                    certSection
                );
            }

            function renderExperienceSection() {
                return el('section', { class: 'section', id: 'experience', 'aria-label': '经历' },
                    el('div', { class: 'section-header' },
                        el('h2', {}, '📋 经历与实践'),
                        el('p', { class: 'section-subtitle' }, '校园 · 项目 · 实习，持续积累中'),
                        el('div', { class: 'section-accent' })
                    ),
                    renderExperienceTabs()
                );
            }

            function renderContactSection() {
                const email = getEmail();
                return el('section', { class: 'section', id: 'contact', 'aria-label': '联系方式' },
                    el('div', { class: 'section-header' },
                        el('h2', {}, '📬 联系我'),
                        el('p', { class: 'section-subtitle' }, '期待与您交流'),
                        el('div', { class: 'section-accent' })
                    ),
                    el('div', {
                        style: 'display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:center;'
                    },
                    el('button', {
                        class: 'btn btn-primary',
                        onclick: copyEmail,
                        style: 'font-size:0.9rem;'
                    }, '✉️ 复制邮箱：' + email),
                    el('a', {
                        class: 'btn btn-secondary',
                        href: 'tel:' + resume.phone,
                        style: 'font-size:0.9rem;'
                    }, '📞 ' + resume.phone),
                    el('a', {
                        class: 'btn btn-secondary',
                        href: 'mailto:' + email,
                        style: 'font-size:0.9rem;'
                    }, '📧 发送邮件')
                    )
                );
            }

            // =============================================
            // Tabs 交互逻辑
            // =============================================
            function switchTab(tabsNav, panels, targetIndex) {
                const btns = tabsNav.querySelectorAll('.tab-btn');
                btns.forEach((btn, i) => {
                    const isTarget = i === targetIndex;
                    btn.setAttribute('aria-selected', isTarget ? 'true' : 'false');
                    btn.tabIndex = isTarget ? 0 : -1;
                });
                panels.forEach((panel, i) => {
                    panel.setAttribute('aria-hidden', i === targetIndex ? 'false' : 'true');
                });
                tabsNav.querySelectorAll('.tab-btn')[targetIndex]?.scrollIntoView({ behavior: 'smooth',
                    block: 'nearest', inline: 'center' });
            }

            function handleTabKeydown(e, tabsNav, panels, currentIndex) {
                const btns = tabsNav.querySelectorAll('.tab-btn');
                let newIndex = -1;
                if (e.key === 'ArrowRight') {
                    newIndex = (currentIndex + 1) % btns.length;
                    e.preventDefault();
                } else if (e.key === 'ArrowLeft') {
                    newIndex = (currentIndex - 1 + btns.length) % btns.length;
                    e.preventDefault();
                } else if (e.key === 'Home') {
                    newIndex = 0;
                    e.preventDefault();
                } else if (e.key === 'End') {
                    newIndex = btns.length - 1;
                    e.preventDefault();
                }
                if (newIndex >= 0) {
                    switchTab(tabsNav, panels, newIndex);
                    btns[newIndex]?.focus();
                }
            }

            // =============================================
            // 组装页面
            // =============================================
            function renderPage() {
                app.innerHTML = '';
                const hero = renderHero();
                const highlights = renderHighlights();
                const skills = renderSkills();
                const experience = renderExperienceSection();
                const education = renderEducationAndCerts();
                const contact = renderContactSection();
                app.append(hero, highlights, skills, experience, education, contact);
                setupSkillBars();
            }

            renderPage();

            // =============================================
            // 响应式主题系统监听
            // =============================================
            const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
            mediaQuery.addEventListener('change', (e) => {
                if (!localStorage.getItem('theme')) {
                    setTheme(e.matches ? 'dark' : 'light', false);
                }
            });

            // =============================================
            // 键盘全局支持
            // =============================================
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    toast.classList.remove('visible');
                }
            });

            console.log('✅ 简历页面已加载 · ' + resume.name);
            console.log('📊 数据统计：' + resume.highlights.length + ' 项亮点 · ' +
                Object.values(resume.certificates).reduce((sum, c) => sum + c.items.length, 0) + ' 项证书');
        })();
    </script>
</body>
</html>
